<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voter Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef;
            margin: 40px;
        }
        .dashboard {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .logout-button {
            background-color: #cc3333;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }
        .logout-button:hover {
            background-color: #a60000;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h2>Welcome, {{ voter_id }}!</h2>
        <p>You are successfully logged in.</p>

        <form action="{{ url_for('logout') }}" method="get">
            <button type="submit" class="logout-button">Logout</button>
        </form>
    </div>
</body>
</html>
